    <!-- Guard: /dashboard należy do nowego Analizatora (backend), nie do starego React Dashboard.
         Przechwytujemy client-side nawigację react-routera na /dashboard i wymuszamy pełne załadowanie. -->
    <script>
    (function(){
      function isDash(u){ try{ return new URL(u, location.origin).pathname === '/dashboard'; }catch(e){ return false; } }
      var _p = history.pushState, _r = history.replaceState;
      history.pushState = function(s,t,u){ if(u!=null && isDash(u)){ location.assign('/dashboard'); return; } return _p.apply(this, arguments); };
      history.replaceState = function(s,t,u){ if(u!=null && isDash(u)){ location.assign('/dashboard'); return; } return _r.apply(this, arguments); };
    })();
    </script>
